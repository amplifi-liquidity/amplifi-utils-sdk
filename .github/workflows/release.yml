name: Release

# Publishing a GitHub release `vX.Y.Z` stages that commit on npm. Nothing goes live until a
# maintainer approves the staged version with 2FA (npmjs.com > Staged Packages, or
# `npm stage approve <id>`). Auth is npm trusted publishing (OIDC): no NPM_TOKEN secret
# exists. npmjs.com trusts only this repository + this workflow file + the `npm-publish`
# environment, and only for `npm stage publish`.
on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # npm OIDC trusted publishing + provenance
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the tag matches package.json and is on master
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          test "$TAG" = "v$version" || { echo "Tag $TAG does not match package.json version $version"; exit 1; }
          git merge-base --is-ancestor HEAD origin/master || { echo "Tag $TAG is not on master"; exit 1; }

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - name: Update npm (staged publishing needs npm >= 11.15.0 and Node >= 22.14)
        run: npm install -g npm@11.17.0
      - run: npm ci
      - run: npm test
      - run: npm run build

      # The gate above already ran; skip lifecycle scripts so `prepublish` does not
      # rebuild dist/ between verification and upload.
      - run: npm stage publish --provenance --access public --ignore-scripts
      - name: Approval required
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: echo "::notice::Staged $TAG. Approve it with 2FA on npmjs.com (Staged Packages) or with npm stage approve <id> to publish it."
